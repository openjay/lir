[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lir"
version = "0.1.0"
description = "Local Inference Runtime - OpenAI-compatible optimization layer for local LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Jay"}]
keywords = ["llm", "inference", "local", "ollama", "lmstudio", "optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
]

[project.urls]
Homepage = "https://github.com/jay/lir"
Repository = "https://github.com/jay/lir"
Documentation = "https://github.com/jay/lir#readme"
Issues = "https://github.com/jay/lir/issues"
Changelog = "https://github.com/jay/lir/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["lir*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

